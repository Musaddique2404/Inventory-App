# Builds the Ateer Android app (APK) and publishes it as a GitHub Release.
# Runs when anything in mobile/ changes, or manually from the Actions tab.
# The app loads the live site, so normal web changes do NOT need a new APK.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Keeps the same signing key between builds so new versions install over old ones
      - name: Restore signing key
        if: env.HAS_KEYSTORE != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ateer-android-debug-keystore-v1

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: npx cap add android

      - name: App icon and splash screen
        run: npx capacitor-assets generate --android

      - name: Configure Android project
        run: node scripts/configure-android.mjs

      - name: Sync web assets and plugins
        run: npx cap sync android

      - name: Build APK (debug-signed)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/Ateer-${VERSION_NAME}.apk"

      - name: Build APK + AAB (release-signed)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/ateer.keystore"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/ateer.keystore"
          (cd .. && node scripts/configure-android.mjs)
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/Ateer-${VERSION_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../dist/Ateer-${VERSION_NAME}.aab"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ateer-${{ env.VERSION_NAME }}
          path: mobile/dist/*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.VERSION_NAME }}
          name: Ateer for Android ${{ env.VERSION_NAME }}
          make_latest: true
          files: mobile/dist/*
          body: |
            **Install on your phone**
            1. Open this page on your Android phone and tap **Ateer-${{ env.VERSION_NAME }}.apk** below.
            2. When Android asks, allow installing apps from your browser ("Install unknown apps").
            3. Open **Ateer** from your home screen and sign in.

            The app loads https://musaddique-stockcontrol.vercel.app, so web updates show up without reinstalling.
