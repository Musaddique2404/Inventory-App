<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ateer — Offline</title>
  <style>
    :root { --bg:#f4f2ef; --card:#fff; --text:#1e2330; --muted:#8a91a0; --orange:#e8710a; --tint:#fef1e6; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141517; --card:#1f2023; --text:#f2f1ee; --tint:rgba(240,127,28,.16); } }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
           display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .wrap { width: 100%; max-width: 380px; display: grid; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 4px 8px; }
    .mark { width: 40px; height: 40px; border-radius: 14px; background: var(--orange); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 17px; }
    .brand small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
    .brand b { font-size: 18px; font-weight: 600; }
    .card { background: var(--card); border-radius: 22px; padding: 22px 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
    .ic { width: 52px; height: 52px; border-radius: 26px; background: var(--tint); color: var(--orange); display: grid; place-items: center; margin-bottom: 6px; }
    h1 { font-size: 18px; font-weight: 600; }
    p { font-size: 14px; color: var(--muted); line-height: 1.45; }
    button { margin-top: 10px; width: 100%; height: 48px; border: none; border-radius: 14px; background: var(--orange); color: #fff; font-size: 15px; font-weight: 600; font-family: inherit; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><span class="mark">A</span><div><small>Musaddique's</small><b>Ateer</b></div></div>
    <div class="card">
      <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16.1a5 5 0 0 1 7 0M12 20h.01M3 3l18 18"/></svg></span>
      <h1>You're offline</h1>
      <p>Ateer needs an internet connection to load your stock, sales and purchases. Check your connection and try again.</p>
      <button onclick="location.href='https://musaddique-stockcontrol.vercel.app/'">Try again</button>
    </div>
  </div>
</body>
</html>
