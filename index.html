<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f4f2ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Ateer - Inventory Management System</title>
  <script>
    // Apply the saved theme before first paint
    try { if (localStorage.getItem('ateer-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ════════════════════════════════════════════
       AUTH SCREEN
  ════════════════════════════════════════════ -->
  <div id="auth-screen">
    <div class="auth-wrap">
      <div class="auth-inner">

        <div class="auth-brand">
          <span class="brand-mark">A</span>
          <div class="brand-text"><span class="brand-owner">Musaddique's</span><span class="brand-name">Ateer</span></div>
        </div>

        <div class="auth-head page-head-text">
          <span class="page-title" id="auth-title">Welcome back</span>
          <span class="page-date" id="auth-sub">Sign in to manage your stock, sales and purchases.</span>
        </div>

        <div class="seg">
          <button class="seg-btn active" id="tab-login"    onclick="switchAuthTab('login')">Sign in</button>
          <button class="seg-btn"        id="tab-register" onclick="switchAuthTab('register')">Create account</button>
        </div>

        <!-- Login -->
        <div id="auth-login-form" class="auth-card">
          <div class="field">
            <label for="login-email">Email address</label>
            <input type="email"    id="login-email"    placeholder="you@example.com" autocomplete="email">
            <span class="err-msg" id="err-login-email"></span>
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
            <span class="err-msg" id="err-login-password"></span>
          </div>
          <div class="err-msg auth-general-err" id="err-login-general"></div>
          <button class="btn btn-primary btn-block" id="btn-login" onclick="handleLogin()">
            <span id="btn-login-text">Sign in</span>
            <span id="btn-login-spin" class="spinner" style="display:none;"></span>
          </button>
        </div>

        <!-- Register -->
        <div id="auth-register-form" class="auth-card" style="display:none;">
          <div class="field">
            <label for="reg-name">Full name</label>
            <input type="text"     id="reg-name"     placeholder="Ahmed Al-Rashid" autocomplete="name">
            <span class="err-msg" id="err-reg-name"></span>
          </div>
          <div class="field">
            <label for="reg-email">Email address</label>
            <input type="email"    id="reg-email"    placeholder="you@example.com" autocomplete="email">
            <span class="err-msg" id="err-reg-email"></span>
          </div>
          <div class="field">
            <label for="reg-password">Password <span class="hint">(min 6 characters)</span></label>
            <input type="password" id="reg-password" placeholder="••••••••" autocomplete="new-password">
            <span class="err-msg" id="err-reg-password"></span>
          </div>
          <div class="err-msg auth-general-err" id="err-reg-general"></div>
          <button class="btn btn-primary btn-block" id="btn-register" onclick="handleRegister()">
            <span id="btn-register-text">Create account</span>
            <span id="btn-register-spin" class="spinner" style="display:none;"></span>
          </button>
        </div>

        <div class="auth-footer-note">🔒 Your data is private — only you can see it</div>
      </div>
    </div>
  </div>

  <!-- ════════════════════════════════════════════
       MAIN APP SCREEN
  ════════════════════════════════════════════ -->
  <div id="app-screen" style="display:none;">

    <header class="topbar">
      <div class="topbar-inner">
        <span class="brand-mark">A</span>
        <div class="brand-text"><span class="brand-owner">Musaddique's</span><span class="brand-name">Ateer</span></div>
        <button class="round-btn" id="settings-btn" title="Settings" aria-label="Settings" onclick="openSettings()"></button>
        <button class="round-btn" id="theme-btn" title="Theme" aria-label="Switch theme" onclick="toggleTheme()"></button>
      </div>
    </header>

    <main class="main">
      <div id="db-loading" class="db-loading-overlay">
        <div class="spinner spinner-lg"></div>
        <div class="db-loading-text">Syncing with cloud…</div>
      </div>

      <div id="dashboard-page" class="page" style="display:grid;"></div>
      <div id="inventory-page" class="page" style="display:none;"></div>
      <div id="sales-page"     class="page" style="display:none;"></div>
      <div id="purchases-page" class="page" style="display:none;"></div>
      <div id="settings-page"  class="page" style="display:none;"></div>
    </main>

    <nav class="tabbar" aria-label="Main">
      <button class="tab-btn active" data-page="dashboard"><span class="tab-ic" data-icon="dashboard"></span><span class="tab-label">Dashboard</span></button>
      <button class="tab-btn" data-page="inventory"><span class="tab-ic" data-icon="box"></span><span class="tab-label">Inventory</span></button>
      <button class="tab-btn" data-page="sales"><span class="tab-ic" data-icon="trend"></span><span class="tab-label">Sales</span></button>
      <button class="tab-btn" data-page="purchases"><span class="tab-ic" data-icon="cart"></span><span class="tab-label">Purchases</span></button>
    </nav>

  </div><!-- /app-screen -->

  <div id="toast-area"    class="toast-area"></div>
  <div id="modal-container"></div>

  <!-- Firebase v9 compat SDKs (no bundler needed) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
